<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imobia • Visualização de construção</title>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    window.supabase = createClient(
      "https://SEU_PROJETO.supabase.co",
      "SUA_ANON_KEY"
    );
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 4px;
    }

    .card {
      background: #1e293b;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }

    .item {
      background: #0b1220;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.06);
      margin-top: 10px;
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
      min-width: 140px;
    }

    input, select, textarea {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 11px 12px;
      margin-top: 8px;
      margin-bottom: 10px;
      font-size: 15px;
      background: white;
      color: black;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button, a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
    }

    .primary {
      background: #22c55e;
      color: black;
    }

    .ghost {
      background: #334155;
      color: white;
    }

    .danger {
      background: #ef4444;
      color: white;
    }

    .warning {
      background: #f59e0b;
      color: black;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
      background: #22c55e;
      color: black;
    }

    .muted {
      color: #cbd5e1;
      font-size: 14px;
    }

    .hero-preview {
      width: 100%;
      min-height: 420px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background:
        linear-gradient(180deg, rgba(56,189,248,.2), rgba(15,23,42,.2)),
        linear-gradient(0deg, #274c2d 0%, #315f36 38%, #5a7b44 39%, #87a361 100%);
      border: 1px solid rgba(255,255,255,.08);
    }

    .preview-sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #7dd3fc 0%, #bfdbfe 35%, rgba(191,219,254,0) 70%);
      opacity: .6;
    }

    .preview-ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 44%;
      background: linear-gradient(180deg, #6b8f47 0%, #496933 100%);
    }

    .preview-road {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 18%;
      background: #4b5563;
      border-top: 4px solid #9ca3af;
    }

    .preview-lot {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 18%;
      height: 26%;
      border: 3px dashed rgba(255,255,255,.7);
      border-radius: 10px;
      background: rgba(255,255,255,.04);
    }

    .preview-building {
      position: absolute;
      left: 22%;
      right: 22%;
      bottom: 26%;
      height: 28%;
      border-radius: 10px 10px 4px 4px;
      background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 100%);
      box-shadow: 0 14px 30px rgba(0,0,0,.25);
      transition: all .25s ease;
    }

    .preview-roof {
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: calc(26% + 28% - 4%);
      height: 8%;
      background: #7c2d12;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      transition: all .25s ease;
    }

    .preview-windows {
      position: absolute;
      left: 28%;
      right: 28%;
      bottom: calc(26% + 9%);
      height: 10%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      transition: all .25s ease;
    }

    .preview-window {
      background: linear-gradient(180deg, #93c5fd 0%, #dbeafe 100%);
      border: 2px solid rgba(0,0,0,.15);
      border-radius: 4px;
    }

    .preview-door {
      position: absolute;
      width: 12%;
      height: 14%;
      left: 44%;
      bottom: 26%;
      background: #78350f;
      border-radius: 6px 6px 0 0;
      transition: all .25s ease;
    }

    .preview-label {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(15,23,42,.75);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
    }

    .history-box {
      max-height: 420px;
      overflow: auto;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .brand {
        font-size: 24px;
      }

      .hero-preview {
        min-height: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">Imobia</div>
        <div class="subtitle" id="page_subtitle">Carregando visualização...</div>
      </div>

      <div class="row" style="max-width:620px;width:100%;">
        <a class="btn ghost" href="./index.html">Portal</a>
        <a class="btn ghost" href="./dashboard.html">Dashboard</a>
        <a class="btn ghost" href="./terrenos.html">Terrenos</a>
        <button class="ghost" onclick="loadPage()">Atualizar</button>
        <button class="danger" onclick="logout()">Sair</button>
      </div>
    </div>

    <div class="grid">
      <div>
        <div class="card">
          <h3 style="margin-top:0;">Terreno selecionado</h3>
          <div id="property_box" class="item">Carregando...</div>
        </div>

        <div class="card">
          <h3 style="margin-top:0;">Parâmetros da visualização</h3>

          <select id="project_type" onchange="generatePreview()">
            <option value="house_single">Casa térrea</option>
            <option value="house_two_floors">Sobrado</option>
            <option value="houses_geminated">Casas geminadas</option>
            <option value="small_building">Prédio pequeno</option>
            <option value="commercial_store">Loja comercial</option>
            <option value="warehouse">Galpão</option>
          </select>

          <div class="row">
            <select id="construction_standard" onchange="generatePreview()">
              <option value="economic">Padrão econômico</option>
              <option value="medium" selected>Padrão médio</option>
              <option value="high">Padrão alto</option>
              <option value="premium">Padrão premium</option>
            </select>

            <select id="lot_use" onchange="generatePreview()">
              <option value="residential">Uso residencial</option>
              <option value="commercial">Uso comercial</option>
              <option value="mixed">Uso misto</option>
            </select>
          </div>

          <div class="row">
            <input id="project_area" type="number" step="0.01" placeholder="Área construída estimada (m²)" onchange="generatePreview()" />
            <input id="floors" type="number" step="1" min="1" max="12" value="1" onchange="generatePreview()" />
          </div>

          <textarea id="prompt_notes" placeholder="Observações para a simulação (fachada moderna, garagem frontal, jardim, etc.)" onchange="generatePreview()"></textarea>

          <div class="row">
            <button class="primary" onclick="generatePreview()">Gerar visualização</button>
            <button class="ghost" onclick="saveVisualizationHistory()">Salvar no banco</button>
          </div>

          <div id="generation_result"></div>
        </div>
      </div>

      <div>
        <div class="card">
          <h3 style="margin-top:0;">Pré-visualização conceitual</h3>

          <div class="hero-preview">
            <div class="preview-sky"></div>
            <div class="preview-ground"></div>
            <div class="preview-road"></div>
            <div class="preview-lot"></div>

            <div id="preview_label" class="preview-label">Aguardando simulação...</div>
            <div id="preview_roof" class="preview-roof"></div>
            <div id="preview_building" class="preview-building"></div>
            <div id="preview_windows" class="preview-windows">
              <div class="preview-window"></div>
              <div class="preview-window"></div>
              <div class="preview-window"></div>
            </div>
            <div id="preview_door" class="preview-door"></div>
          </div>

          <div id="analysis_box" class="item" style="margin-top:12px;">
            Gere a simulação para ver a análise do terreno e da implantação.
          </div>
        </div>

        <div class="card">
          <h3 style="margin-top:0;">Histórico salvo no banco</h3>
          <div id="history_box" class="history-box">Sem histórico ainda.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentProfile = null;
    let currentProperty = null;
    let propertyId = null;
    let lastVisualization = null;

    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    async function logout() {
      await supabase.auth.signOut();
      location.href = "./app.html";
    }

    async function getSession() {
      const { data } = await supabase.auth.getSession();
      return data.session;
    }

    async function getUser() {
      const { data } = await supabase.auth.getUser();
      return data.user;
    }

    async function getProfile() {
      const { data, error } = await supabase
        .from("imobix_users")
        .select("*, imobix_companies(name)")
        .eq("user_id", currentUser.id)
        .eq("active", true)
        .limit(1)
        .maybeSingle();

      if (error || !data) return null;
      return data;
    }

    async function getProperty() {
      const { data, error } = await supabase
        .from("properties")
        .select("*")
        .eq("id", propertyId)
        .eq("property_type", "land")
        .limit(1)
        .maybeSingle();

      if (error || !data) return null;
      return data;
    }

    function roleLabel(role) {
      if (role === "admin") return "Admin";
      if (role === "broker") return "Corretor";
      if (role === "client") return "Cliente";
      if (role === "owner") return "Proprietário";
      return role || "-";
    }

    function purposeLabel(v) {
      if (v === "sale") return "Venda";
      if (v === "rent") return "Aluguel";
      return v || "-";
    }

    function formatMoney(v) {
      if (v === null || v === undefined || v === "") return "-";
      return Number(v).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function renderProperty() {
      const box = document.getElementById("property_box");

      if (!currentProperty) {
        box.innerHTML = "Terreno não encontrado.";
        return;
      }

      box.innerHTML = `
        <b>${currentProperty.title}</b><br>
        Finalidade: ${purposeLabel(currentProperty.purpose)}<br>
        Cidade: ${currentProperty.city || "-"}<br>
        Bairro: ${currentProperty.neighborhood || "-"}<br>
        Endereço: ${currentProperty.address || "-"}<br>
        Área: ${currentProperty.area_m2 || "-"} m²<br>
        Preço: ${formatMoney(currentProperty.price)}<br>
        ${currentProperty.description ? `<div class="muted" style="margin-top:8px;">${currentProperty.description}</div>` : ""}
      `;
    }

    function suggestProjectArea() {
      if (!currentProperty?.area_m2) return 120;

      const lotArea = Number(currentProperty.area_m2 || 0);
      const projectType = document.getElementById("project_type").value;
      const floors = Number(document.getElementById("floors").value || 1);

      let ratio = 0.5;

      if (projectType === "house_single") ratio = 0.45;
      if (projectType === "house_two_floors") ratio = 0.35 * Math.max(1, floors);
      if (projectType === "houses_geminated") ratio = 0.6;
      if (projectType === "small_building") ratio = 0.4 * Math.max(2, floors);
      if (projectType === "commercial_store") ratio = 0.55;
      if (projectType === "warehouse") ratio = 0.75;

      return Math.max(60, Math.round(lotArea * ratio));
    }

    function getProjectLabel(value) {
      if (value === "house_single") return "Casa térrea";
      if (value === "house_two_floors") return "Sobrado";
      if (value === "houses_geminated") return "Casas geminadas";
      if (value === "small_building") return "Prédio pequeno";
      if (value === "commercial_store") return "Loja comercial";
      if (value === "warehouse") return "Galpão";
      return value;
    }

    function getStandardLabel(value) {
      if (value === "economic") return "econômico";
      if (value === "medium") return "médio";
      if (value === "high") return "alto";
      if (value === "premium") return "premium";
      return value;
    }

    function applyPreviewStyles(projectType, standard, floors) {
      const building = document.getElementById("preview_building");
      const roof = document.getElementById("preview_roof");
      const windows = document.getElementById("preview_windows");
      const door = document.getElementById("preview_door");

      let height = 28;
      let left = 22;
      let right = 22;
      let roofVisible = true;
      let buildingColor = "linear-gradient(180deg, #f8fafc 0%, #cbd5e1 100%)";
      let roofColor = "#7c2d12";

      if (projectType === "house_single") {
        height = 24;
        left = 23;
        right = 23;
      }

      if (projectType === "house_two_floors") {
        height = Math.min(42, 24 + (floors * 7));
        left = 24;
        right = 24;
      }

      if (projectType === "houses_geminated") {
        height = 24;
        left = 18;
        right = 18;
      }

      if (projectType === "small_building") {
        height = Math.min(55, 28 + (floors * 5));
        left = 28;
        right = 28;
        roofVisible = false;
      }

      if (projectType === "commercial_store") {
        height = 22;
        left = 18;
        right = 18;
        roofVisible = false;
      }

      if (projectType === "warehouse") {
        height = 20;
        left = 14;
        right = 14;
        roofVisible = false;
      }

      if (standard === "economic") {
        buildingColor = "linear-gradient(180deg, #e5e7eb 0%, #9ca3af 100%)";
        roofColor = "#6b7280";
      }

      if (standard === "medium") {
        buildingColor = "linear-gradient(180deg, #f8fafc 0%, #cbd5e1 100%)";
        roofColor = "#7c2d12";
      }

      if (standard === "high") {
        buildingColor = "linear-gradient(180deg, #fef3c7 0%, #fde68a 100%)";
        roofColor = "#92400e";
      }

      if (standard === "premium") {
        buildingColor = "linear-gradient(180deg, #e0f2fe 0%, #93c5fd 100%)";
        roofColor = "#1e3a8a";
      }

      building.style.height = `${height}%`;
      building.style.left = `${left}%`;
      building.style.right = `${right}%`;
      building.style.background = buildingColor;

      roof.style.display = roofVisible ? "block" : "none";
      roof.style.background = roofColor;

      if (projectType === "warehouse") {
        windows.style.left = "20%";
        windows.style.right = "20%";
        windows.style.gridTemplateColumns = "repeat(5, 1fr)";
        door.style.width = "18%";
        door.style.left = "41%";
      } else if (projectType === "small_building") {
        windows.style.left = "24%";
        windows.style.right = "24%";
        windows.style.gridTemplateColumns = "repeat(4, 1fr)";
        door.style.width = "10%";
        door.style.left = "45%";
      } else if (projectType === "commercial_store") {
        windows.style.left = "18%";
        windows.style.right = "18%";
        windows.style.gridTemplateColumns = "repeat(2, 1fr)";
        door.style.width = "16%";
        door.style.left = "42%";
      } else if (projectType === "houses_geminated") {
        windows.style.left = "20%";
        windows.style.right = "20%";
        windows.style.gridTemplateColumns = "repeat(4, 1fr)";
        door.style.width = "10%";
        door.style.left = "45%";
      } else {
        windows.style.left = "28%";
        windows.style.right = "28%";
        windows.style.gridTemplateColumns = "repeat(3, 1fr)";
        door.style.width = "12%";
        door.style.left = "44%";
      }
    }

    function buildAnalysis(projectType, standard, area, floors, notes) {
      const lotArea = Number(currentProperty?.area_m2 || 0);
      const occupancy = lotArea ? ((area / lotArea) * 100).toFixed(1) : "-";
      const typeLabel = getProjectLabel(projectType);
      const standardLabel = getStandardLabel(standard);

      let comment = "Implantação equilibrada para apresentação comercial.";
      if (projectType === "small_building") comment = "Boa leitura para investidor que busca verticalização leve.";
      if (projectType === "houses_geminated") comment = "Boa opção para lote com potencial de subdivisão residencial.";
      if (projectType === "commercial_store") comment = "Boa leitura para frente comercial e operação de rua.";
      if (projectType === "warehouse") comment = "Boa leitura para uso logístico ou industrial leve.";
      if (projectType === "house_two_floors") comment = "Sobrado ajuda a aproveitar melhor o lote mantendo área livre.";

      return `
        <b>Leitura da simulação</b><br>
        Projeto sugerido: ${typeLabel}<br>
        Padrão visual: ${standardLabel}<br>
        Área construída estimada: ${area} m²<br>
        Pavimentos considerados: ${floors}<br>
        Ocupação aproximada do lote: ${occupancy}%<br>
        Análise: ${comment}<br>
        ${notes ? `<br><b>Observações:</b> ${notes}` : ""}
      `;
    }

    function generatePreview() {
      if (!currentProperty) return;

      const projectType = document.getElementById("project_type").value;
      const standard = document.getElementById("construction_standard").value;
      const lotUse = document.getElementById("lot_use").value;
      const floors = Math.max(1, Number(document.getElementById("floors").value || 1));
      const notes = document.getElementById("prompt_notes").value.trim();

      let area = Number(document.getElementById("project_area").value || 0);
      if (!area) {
        area = suggestProjectArea();
        document.getElementById("project_area").value = area;
      }

      applyPreviewStyles(projectType, standard, floors);

      const previewLabel = document.getElementById("preview_label");
      previewLabel.textContent = `${getProjectLabel(projectType)} • ${getStandardLabel(standard)} • ${lotUse}`;

      const analysisHtml = buildAnalysis(projectType, standard, area, floors, notes);
      document.getElementById("analysis_box").innerHTML = analysisHtml;

      lastVisualization = {
        company_id: currentProfile.company_id,
        property_id: propertyId,
        created_by: currentUser.id,
        project_type: projectType,
        construction_standard: standard,
        lot_use: lotUse,
        floors,
        project_area: area,
        notes: notes || null,
        result_summary: analysisHtml.replace(/<br>/g, "\n").replace(/<[^>]+>/g, ""),
        preview_data: {
          previewLabel: previewLabel.textContent,
          projectLabel: getProjectLabel(projectType),
          standardLabel: getStandardLabel(standard),
          lotUse
        }
      };

      document.getElementById("generation_result").innerHTML =
        `<div class="item">Simulação visual atualizada com sucesso.</div>`;
    }

    async function renderHistory() {
      const box = document.getElementById("history_box");

      const { data, error } = await supabase
        .from("property_visualizations")
        .select("*")
        .eq("property_id", propertyId)
        .order("created_at", { ascending: false });

      if (error) {
        box.innerHTML = `<div class="item">${error.message}</div>`;
        return;
      }

      if (!data || !data.length) {
        box.innerHTML = "Sem histórico ainda.";
        return;
      }

      box.innerHTML = data.map(h => `
        <div class="item">
          <b>${getProjectLabel(h.project_type)}</b><br>
          Padrão: ${getStandardLabel(h.construction_standard)}<br>
          Área: ${h.project_area || "-"} m²<br>
          Pavimentos: ${h.floors || "-"}<br>
          Data: ${new Date(h.created_at).toLocaleString("pt-BR")}<br>
          ${h.notes ? `<div class="muted" style="margin-top:8px;">${h.notes}</div>` : ""}
        </div>
      `).join("");
    }

    async function saveVisualizationHistory() {
      if (!lastVisualization) {
        document.getElementById("generation_result").innerHTML =
          `<div class="item">Gere uma simulação antes de salvar.</div>`;
        return;
      }

      const { error } = await supabase
        .from("property_visualizations")
        .insert(lastVisualization);

      if (error) {
        document.getElementById("generation_result").innerHTML =
          `<div class="item">${error.message}</div>`;
        return;
      }

      document.getElementById("generation_result").innerHTML =
        `<div class="item">Simulação salva no banco com sucesso.</div>`;

      await renderHistory();
    }

    async function loadPage() {
      propertyId = getQueryParam("property_id");

      const session = await getSession();

      if (!session) {
        location.href = "./app.html";
        return;
      }

      currentUser = await getUser();
      currentProfile = await getProfile();

      if (!currentProfile) {
        location.href = "./app.html";
        return;
      }

      if (!propertyId) {
        document.getElementById("property_box").innerHTML = "Nenhum terreno informado.";
        return;
      }

      currentProperty = await getProperty();

      document.getElementById("page_subtitle").textContent =
        `${currentProfile.imobix_companies?.name || "Imobiliária"} • ${roleLabel(currentProfile.role)} • Visualização`;

      renderProperty();
      await renderHistory();

      if (!document.getElementById("project_area").value) {
        document.getElementById("project_area").value = suggestProjectArea();
      }

      generatePreview();
    }

    loadPage();

    window.logout = logout;
    window.loadPage = loadPage;
    window.generatePreview = generatePreview;
    window.saveVisualizationHistory = saveVisualizationHistory;
  </script>
</body>
</html>
