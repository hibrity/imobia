<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imobia • Plataforma imobiliária inteligente</title>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    window.supabase = createClient(
      "https://bcfjciljugeascgyokxa.supabase.co",
      "sb_publishable_bFrxuAZOZprjXqrnhrjK2w_i1adudLw"
    );
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1736;
      color: #ffffff;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .brand {
      font-size: 28px;
      font-weight: 700;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card {
      background: #1f2b44;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }

    .hero-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
      margin: 0 0 16px 0;
    }

    .hero-text {
      font-size: 16px;
      color: #e2e8f0;
      line-height: 1.4;
      margin: 0;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .property-card {
      background: #0b1220;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 14px;
      padding: 14px;
    }

    .property-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .muted {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #22c55e;
      color: #000000;
      font-size: 12px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 8px;
      margin-bottom: 10px;
      font-size: 16px;
      background: #ffffff;
      color: #111827;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button,
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }

    .primary {
      background: #22c55e;
      color: #000000;
    }

    .ghost {
      background: #334155;
      color: #ffffff;
    }

    .outline {
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255,255,255,.16);
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
      min-width: 140px;
    }

    .empty-box {
      background: #0b1220;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.06);
      color: #cbd5e1;
    }

    @media (max-width: 900px) {
      .hero-title {
        font-size: 24px;
      }

      .brand {
        font-size: 26px;
      }

      .nav-actions {
        width: 100%;
      }

      .nav-actions a {
        flex: 1 1 calc(50% - 10px);
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Imobia</div>

      <div class="nav-actions">
        <a class="btn ghost" href="#buscar">Buscar</a>
        <a class="btn ghost" href="./anunciar.html">Anunciar imóvel</a>
        <a class="btn ghost" href="./imobia-ai.html">Imobia AI</a>
        <a class="btn primary" href="./app.html">Entrar</a>
        <a class="btn outline" href="./app.html">Criar conta</a>
      </div>
    </div>

    <div class="card">
      <h1 class="hero-title">Plataforma imobiliária inteligente</h1>
      <p class="hero-text">
        A Imobia conecta compradores, corretores e proprietários em uma plataforma com inteligência artificial.
      </p>
    </div>

    <div id="buscar" class="card">
      <h2 style="margin-top:0;">Buscar imóveis</h2>

      <input id="search_city" placeholder="Cidade" />

      <select id="search_type">
        <option value="">Tipo</option>
        <option value="house">Casa</option>
        <option value="apartment">Apartamento</option>
        <option value="land">Terreno</option>
        <option value="commercial">Comercial</option>
      </select>

      <input id="search_price" type="number" placeholder="Preço máximo" />

      <button class="primary" onclick="searchProperties()">Buscar</button>
    </div>

    <div class="card">
      <h2 style="margin-top:0;">Resultados</h2>
      <div id="property_list" class="results-grid">
        <div class="empty-box">Carregando imóveis...</div>
      </div>
    </div>
  </div>

  <script>
    function formatMoney(value) {
      if (value === null || value === undefined || value === "") return "-";
      return Number(value).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function propertyTypeLabel(type) {
      if (type === "house") return "Casa";
      if (type === "apartment") return "Apartamento";
      if (type === "land") return "Terreno";
      if (type === "commercial") return "Comercial";
      return type || "-";
    }

    function purposeLabel(purpose) {
      if (purpose === "sale") return "Venda";
      if (purpose === "rent") return "Aluguel";
      return purpose || "-";
    }

    function renderProperties(data) {
      const list = document.getElementById("property_list");

      if (!data || !data.length) {
        list.innerHTML = `<div class="empty-box">Nenhum imóvel encontrado.</div>`;
        return;
      }

      list.innerHTML = data.map(p => `
        <div class="property-card">
          <div class="property-title">${p.title || "Imóvel"}</div>
          <div class="muted">
            ${propertyTypeLabel(p.property_type)} • ${purposeLabel(p.purpose)}<br>
            ${p.city || "-"}${p.neighborhood ? " • " + p.neighborhood : ""}<br>
            Preço: ${formatMoney(p.price)}<br>
            Área: ${p.area_m2 || "-"} m²
          </div>

          <span class="badge">${p.status || "available"}</span>

          <div class="row" style="margin-top:12px;">
            <a class="btn ghost" href="./imovel.html?id=${encodeURIComponent(p.id)}">Ver imóvel</a>
            <a class="btn primary" href="./app.html">Tenho interesse</a>
          </div>
        </div>
      `).join("");
    }

    async function searchProperties() {
      const city = document.getElementById("search_city").value.trim();
      const type = document.getElementById("search_type").value;
      const price = document.getElementById("search_price").value.trim();

      let query = supabase
        .from("properties")
        .select("*")
        .eq("is_public", true)
        .order("created_at", { ascending: false });

      if (city) {
        query = query.ilike("city", `%${city}%`);
      }

      if (type) {
        query = query.eq("property_type", type);
      }

      const { data, error } = await query;

      if (error) {
        document.getElementById("property_list").innerHTML =
          `<div class="empty-box">${error.message}</div>`;
        return;
      }

      let filtered = data || [];

      if (price) {
        const maxPrice = Number(price);
        filtered = filtered.filter(item => Number(item.price || 0) <= maxPrice);
      }

      renderProperties(filtered);
    }

    searchProperties();
  </script>
</body>
</html>
