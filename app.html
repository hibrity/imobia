<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Imobia • Acesso</title>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

window.supabase = createClient(
  "https://bcfjciljugeascgyokxa.supabase.co",
  "sb_publishable_bFrxuAZOZprjXqrnhrjK2w_i1adudLw"
);
</script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.wrap{
max-width:420px;
margin:auto;
padding:30px;
}

.card{
background:#1e293b;
padding:24px;
border-radius:12px;
margin-bottom:20px;
}

h2{
margin-top:0;
}

input{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.primary{
background:#22c55e;
color:black;
}

.ghost{
background:#334155;
color:white;
}

.item{
background:#0b1220;
padding:10px;
border-radius:8px;
margin-top:10px;
}

.center{
text-align:center;
}

a{
color:#22c55e;
cursor:pointer;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="wrap">

<div class="center">
<h1>Imobia</h1>
<p>Plataforma imobiliária inteligente</p>
</div>

<div class="card">

<h2>Entrar</h2>

<input id="login_email" placeholder="Email">

<input id="login_password" type="password" placeholder="Senha">

<button class="primary" onclick="login()">
Entrar
</button>

<div id="login_result"></div>

<p class="center">
Não tem conta?
<a onclick="showSignup()">Criar conta</a>
</p>

</div>

<div id="signup_block" class="card hidden">

<h2>Criar conta</h2>

<input id="signup_email" placeholder="Email">

<input id="signup_password" type="password" placeholder="Senha">

<button class="primary" onclick="signup()">
Criar conta
</button>

<div id="signup_result"></div>

<p class="center">
Já tem conta?
<a onclick="showLogin()">Entrar</a>
</p>

</div>

</div>

<script>

function showSignup(){
document.querySelector(".card").classList.add("hidden");
document.getElementById("signup_block").classList.remove("hidden");
}

function showLogin(){
document.querySelector(".card").classList.remove("hidden");
document.getElementById("signup_block").classList.add("hidden");
}

async function login(){

const email=document.getElementById("login_email").value;
const password=document.getElementById("login_password").value;

const box=document.getElementById("login_result");
box.innerHTML="";

const {error}=await supabase.auth.signInWithPassword({
email,
password
});

if(error){
box.innerHTML=`<div class="item">${error.message}</div>`;
return;
}

location.href="./dashboard.html";

}

async function signup(){

const email=document.getElementById("signup_email").value;
const password=document.getElementById("signup_password").value;

const box=document.getElementById("signup_result");
box.innerHTML="";

if(!email || !password){
box.innerHTML=`<div class="item">Preencha email e senha.</div>`;
return;
}

const {error}=await supabase.auth.signUp({
email,
password,
options:{
emailRedirectTo:"https://hibrity.github.io/imobia/app.html"
}
});

if(error){
box.innerHTML=`<div class="item">${error.message}</div>`;
return;
}

box.innerHTML=`<div class="item">
Conta criada. Verifique seu email para confirmar.
</div>`;

}

</script>

</body>
</html>
