<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imobia • Visitas</title>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    window.supabase = createClient(
      "https://SEU_PROJETO.supabase.co",
      "SUA_ANON_KEY"
    );
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 4px;
    }

    .card {
      background: #1e293b;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }

    .item {
      background: #0b1220;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.06);
      margin-top: 10px;
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
      min-width: 140px;
    }

    input, select, textarea {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 11px 12px;
      margin-top: 8px;
      margin-bottom: 10px;
      font-size: 15px;
      background: white;
      color: black;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button, a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
    }

    .primary {
      background: #22c55e;
      color: black;
    }

    .ghost {
      background: #334155;
      color: white;
    }

    .danger {
      background: #ef4444;
      color: white;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
      background: #22c55e;
      color: black;
    }

    .muted {
      color: #cbd5e1;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .brand {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">Imobia</div>
        <div class="subtitle" id="page_subtitle">Carregando visitas...</div>
      </div>

      <div class="row" style="max-width:460px;width:100%;">
        <a class="btn ghost" href="./index.html">Portal</a>
        <a class="btn ghost" href="./dashboard.html">Dashboard</a>
        <button class="ghost" onclick="loadPage()">Atualizar</button>
        <button class="danger" onclick="logout()">Sair</button>
      </div>
    </div>

    <div id="create_block" class="card hidden">
      <h3 style="margin-top:0;">Nova visita</h3>

      <select id="property_id"></select>
      <select id="client_id"></select>

      <div class="row">
        <input id="visit_date" type="datetime-local" />
        <select id="broker_user_id"></select>
      </div>

      <select id="visit_status">
        <option value="scheduled">Agendada</option>
        <option value="confirmed">Confirmada</option>
        <option value="completed">Realizada</option>
        <option value="cancelled">Cancelada</option>
      </select>

      <textarea id="visit_notes" placeholder="Observações"></textarea>

      <button class="primary" onclick="createVisit()">Salvar visita</button>
      <div id="create_result"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Filtros</h3>

      <div class="row">
        <input id="filter_property" placeholder="Título do imóvel" />
        <input id="filter_client" placeholder="Nome do cliente" />
        <select id="filter_status">
          <option value="">Todos os status</option>
          <option value="scheduled">Agendada</option>
          <option value="confirmed">Confirmada</option>
          <option value="completed">Realizada</option>
          <option value="cancelled">Cancelada</option>
        </select>
      </div>

      <button class="ghost" onclick="loadVisits()">Aplicar filtros</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Lista de visitas</h3>
      <div id="visits_list">Carregando...</div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentProfile = null;
    let brokers = [];
    let properties = [];
    let clients = [];

    async function logout() {
      await supabase.auth.signOut();
      location.href = "./app.html";
    }

    async function getSession() {
      const { data } = await supabase.auth.getSession();
      return data.session;
    }

    async function getUser() {
      const { data } = await supabase.auth.getUser();
      return data.user;
    }

    async function getProfile() {
      const { data, error } = await supabase
        .from("imobix_users")
        .select("*, imobix_companies(name)")
        .eq("user_id", currentUser.id)
        .eq("active", true)
        .limit(1)
        .maybeSingle();

      if (error || !data) return null;
      return data;
    }

    function roleLabel(role) {
      if (role === "admin") return "Admin";
      if (role === "broker") return "Corretor";
      if (role === "client") return "Cliente";
      if (role === "owner") return "Proprietário";
      return role || "-";
    }

    function visitStatusLabel(v) {
      if (v === "scheduled") return "Agendada";
      if (v === "confirmed") return "Confirmada";
      if (v === "completed") return "Realizada";
      if (v === "cancelled") return "Cancelada";
      return v || "-";
    }

    function canManageVisits() {
      return ["admin", "broker"].includes(currentProfile?.role);
    }

    async function loadBrokers() {
      const { data } = await supabase
        .from("imobix_users")
        .select("*")
        .eq("company_id", currentProfile.company_id)
        .eq("role", "broker")
        .eq("active", true)
        .order("full_name", { ascending: true });

      brokers = data || [];
      renderBrokerSelects();
    }

    async function loadPropertiesOptions() {
      let query = supabase
        .from("properties")
        .select("*")
        .eq("company_id", currentProfile.company_id)
        .order("title", { ascending: true });

      if (currentProfile.role === "broker") {
        query = query.eq("broker_user_id", currentUser.id);
      }

      const { data } = await query;
      properties = data || [];
      renderPropertySelect();
    }

    async function loadClientsOptions() {
      let query = supabase
        .from("property_clients")
        .select("*")
        .eq("company_id", currentProfile.company_id)
        .order("full_name", { ascending: true });

      if (currentProfile.role === "broker") {
        query = query.eq("assigned_broker_user_id", currentUser.id);
      }

      const { data } = await query;
      clients = data || [];
      renderClientSelect();
    }

    function renderPropertySelect() {
      const select = document.getElementById("property_id");
      if (!select) return;

      select.innerHTML = `
        <option value="">Selecione o imóvel</option>
        ${properties.map(p => `
          <option value="${p.id}">
            ${p.title} ${p.city ? "• " + p.city : ""}
          </option>
        `).join("")}
      `;
    }

    function renderClientSelect() {
      const select = document.getElementById("client_id");
      if (!select) return;

      select.innerHTML = `
        <option value="">Selecione o cliente</option>
        ${clients.map(c => `
          <option value="${c.id}">
            ${c.full_name}${c.phone ? " • " + c.phone : ""}
          </option>
        `).join("")}
      `;
    }

    function renderBrokerSelects() {
      const createSelect = document.getElementById("broker_user_id");
      if (!createSelect) return;

      const options = brokers.map(b => `
        <option value="${b.user_id}">
          ${b.full_name || b.user_id}
        </option>
      `).join("");

      if (currentProfile.role === "broker") {
        createSelect.innerHTML = `<option value="${currentUser.id}">Eu mesmo</option>`;
        createSelect.value = currentUser.id;
      } else {
        createSelect.innerHTML = `
          <option value="">Selecione o corretor</option>
          ${options}
        `;
      }
    }

    function getBrokerName(userId) {
      const broker = brokers.find(b => b.user_id === userId);
      return broker?.full_name || broker?.user_id || "-";
    }

    function getPropertyTitle(id) {
      const property = properties.find(p => p.id === id);
      return property?.title || "-";
    }

    function getClientName(id) {
      const client = clients.find(c => c.id === id);
      return client?.full_name || "-";
    }

    async function createVisit() {
      const box = document.getElementById("create_result");

      const brokerUserId =
        currentProfile.role === "broker"
          ? currentUser.id
          : (document.getElementById("broker_user_id").value || null);

      const payload = {
        company_id: currentProfile.company_id,
        property_id: document.getElementById("property_id").value || null,
        client_id: document.getElementById("client_id").value || null,
        broker_user_id: brokerUserId,
        visit_date: document.getElementById("visit_date").value || null,
        status: document.getElementById("visit_status").value,
        notes: document.getElementById("visit_notes").value.trim() || null,
        created_by: currentUser.id
      };

      if (!payload.property_id || !payload.client_id || !payload.visit_date) {
        box.innerHTML = `<div class="item">Preencha imóvel, cliente e data da visita.</div>`;
        return;
      }

      const { error } = await supabase.from("property_visits").insert(payload);

      if (error) {
        box.innerHTML = `<div class="item">${error.message}</div>`;
        return;
      }

      box.innerHTML = `<div class="item">Visita salva com sucesso.</div>`;
      clearCreateForm();
      await loadVisits();
    }

    function clearCreateForm() {
      document.getElementById("property_id").value = "";
      document.getElementById("client_id").value = "";
      document.getElementById("visit_date").value = "";
      document.getElementById("visit_status").value = "scheduled";
      document.getElementById("visit_notes").value = "";
      if (currentProfile.role !== "broker") {
        document.getElementById("broker_user_id").value = "";
      }
    }

    async function updateVisitField(id, field, value) {
      if (!canManageVisits()) return;

      const payload = {};
      payload[field] = value || null;

      const { error } = await supabase
        .from("property_visits")
        .update(payload)
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      await loadVisits();
    }

    async function saveVisitNotes(id) {
      if (!canManageVisits()) return;

      const notes = document.getElementById(`notes_${id}`).value;

      const { error } = await supabase
        .from("property_visits")
        .update({ notes: notes || null })
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      await loadVisits();
    }

    async function loadVisits() {
      const propertyFilter = document.getElementById("filter_property").value.trim().toLowerCase();
      const clientFilter = document.getElementById("filter_client").value.trim().toLowerCase();
      const statusFilter = document.getElementById("filter_status").value;

      let query = supabase
        .from("property_visits")
        .select("*")
        .order("visit_date", { ascending: false });

      if (currentProfile.role === "broker") {
        query = query.eq("broker_user_id", currentUser.id);
      }

      if (currentProfile.role === "client") {
        const ownClient = clients.find(c => c.user_id === currentUser.id);
        if (ownClient) {
          query = query.eq("client_id", ownClient.id);
        }
      }

      if (statusFilter) {
        query = query.eq("status", statusFilter);
      }

      const { data, error } = await query;
      const box = document.getElementById("visits_list");

      if (error) {
        box.innerHTML = `<div class="item">${error.message}</div>`;
        return;
      }

      let visits = data || [];

      if (propertyFilter) {
        visits = visits.filter(v =>
          getPropertyTitle(v.property_id).toLowerCase().includes(propertyFilter)
        );
      }

      if (clientFilter) {
        visits = visits.filter(v =>
          getClientName(v.client_id).toLowerCase().includes(clientFilter)
        );
      }

      if (!visits.length) {
        box.innerHTML = `<div class="item">Nenhuma visita encontrada.</div>`;
        return;
      }

      box.innerHTML = visits.map(v => {
        const manageBlock = canManageVisits()
          ? `
            <div class="row" style="margin-top:10px;">
              <select onchange="updateVisitField('${v.id}','status',this.value)">
                <option value="scheduled" ${v.status === "scheduled" ? "selected" : ""}>Agendada</option>
                <option value="confirmed" ${v.status === "confirmed" ? "selected" : ""}>Confirmada</option>
                <option value="completed" ${v.status === "completed" ? "selected" : ""}>Realizada</option>
                <option value="cancelled" ${v.status === "cancelled" ? "selected" : ""}>Cancelada</option>
              </select>

              <input
                type="datetime-local"
                value="${v.visit_date ? new Date(new Date(v.visit_date).getTime() - new Date(v.visit_date).getTimezoneOffset() * 60000).toISOString().slice(0,16) : ""}"
                onchange="updateVisitField('${v.id}','visit_date',this.value)"
              />
            </div>

            <textarea id="notes_${v.id}" placeholder="Observações">${v.notes || ""}</textarea>

            <div class="row">
              <button class="ghost" onclick="saveVisitNotes('${v.id}')">Salvar observações</button>
            </div>
          `
          : "";

        return `
          <div class="item">
            <b>${getPropertyTitle(v.property_id)}</b><br>
            Cliente: ${getClientName(v.client_id)}<br>
            Corretor: ${getBrokerName(v.broker_user_id)}<br>
            Data: ${v.visit_date ? new Date(v.visit_date).toLocaleString("pt-BR") : "-"}<br>
            <span class="badge">${visitStatusLabel(v.status)}</span>
            ${v.notes ? `<div class="muted" style="margin-top:8px;">${v.notes}</div>` : ""}
            ${manageBlock}
          </div>
        `;
      }).join("");
    }

    async function loadPage() {
      const session = await getSession();

      if (!session) {
        location.href = "./app.html";
        return;
      }

      currentUser = await getUser();
      currentProfile = await getProfile();

      if (!currentProfile) {
        location.href = "./app.html";
        return;
      }

      document.getElementById("page_subtitle").textContent =
        `${currentProfile.imobix_companies?.name || "Imobiliária"} • ${roleLabel(currentProfile.role)}`;

      if (canManageVisits()) {
        document.getElementById("create_block").classList.remove("hidden");
      } else {
        document.getElementById("create_block").classList.add("hidden");
      }

      await loadBrokers();
      await loadPropertiesOptions();
      await loadClientsOptions();
      await loadVisits();
    }

    loadPage();

    window.logout = logout;
    window.loadPage = loadPage;
    window.loadVisits = loadVisits;
    window.createVisit = createVisit;
    window.updateVisitField = updateVisitField;
    window.saveVisitNotes = saveVisitNotes;
  </script>
</body>
</html>
