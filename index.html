<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Imobia • Portal</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
    }

    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .primary {
      background: #22c55e;
      color: black;
    }

    .ghost {
      background: #334155;
      color: white;
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #cbd5e1;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-top: 10px;
      background: white;
      color: black;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
      min-width: 150px;
    }

    .item {
      background: #0b1220;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- TOPO -->
    <div class="topbar">
      <div class="brand">Imobia</div>

      <div class="nav">
        <!-- 🔥 CORRIGIDO -->
        <a class="btn ghost" href="./app.html?mode=signup&role=client&next=anunciar.html">
          Anunciar imóvel
        </a>

        <a class="btn ghost" href="./imobia-ai.html">Imobia AI</a>

        <a class="btn primary" href="./app.html">Entrar</a>

        <a class="btn ghost" href="./app.html?mode=signup">
          Criar conta
        </a>
      </div>
    </div>

    <!-- HERO -->
    <div class="hero">
      <h1>Encontre seu próximo imóvel</h1>
      <p>Busque casas, apartamentos, terrenos e imóveis comerciais em um só lugar.</p>
    </div>

    <!-- BUSCA -->
    <div class="card">
      <h3>Buscar imóveis</h3>

      <div class="row">
        <input placeholder="Cidade" />
        <select>
          <option>Tipo</option>
          <option>Casa</option>
          <option>Apartamento</option>
          <option>Terreno</option>
        </select>
        <select>
          <option>Finalidade</option>
          <option>Venda</option>
          <option>Aluguel</option>
        </select>
        <input placeholder="Preço máximo" />
      </div>

      <div style="margin-top: 10px;">
        <button class="btn primary">Buscar</button>
      </div>
    </div>

    <!-- DESTAQUE -->
    <div class="card">
      <h3>Imóveis em destaque</h3>
      <p style="color:#cbd5e1;">Veja algumas opções disponíveis no portal.</p>

      <div class="item">Carregando imóveis...</div>
    </div>

  </div>
</body>
</html>
