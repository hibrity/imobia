<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imobia • Plataforma imobiliária</title>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

window.supabase = createClient(
  "https://bcfjciljugeascgyokxa.supabase.co",
  "sb_publishable_bFrxuAZOZprjXqrnhrjK2w_i1adudLw"
);
</script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial, sans-serif;
background:#0f172a;
color:white;
}

.wrap{
max-width:1200px;
margin:auto;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:12px;
margin-bottom:20px;
}

.brand{
font-size:28px;
font-weight:bold;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

button,a.btn{
padding:12px 18px;
border-radius:10px;
border:none;
cursor:pointer;
font-weight:bold;
text-decoration:none;
display:inline-flex;
align-items:center;
justify-content:center;
}

.primary{
background:#22c55e;
color:black;
}

.ghost{
background:#334155;
color:white;
}

.outline{
background:transparent;
border:1px solid rgba(255,255,255,.2);
color:white;
}

.card{
background:#1e293b;
padding:24px;
border-radius:16px;
margin-bottom:18px;
}

.hero{
text-align:center;
margin-bottom:20px;
}

.hero h1{
margin:0;
font-size:32px;
}

.hero p{
color:#cbd5e1;
margin-top:10px;
}

.search-card{
background:#0b1220;
border:1px solid rgba(255,255,255,.06);
border-radius:16px;
padding:20px;
}

.search-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-top:12px;
}

input,select{
width:100%;
padding:14px;
border-radius:10px;
border:none;
font-size:15px;
}

.results{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:14px;
}

.property{
background:#0b1220;
border-radius:14px;
padding:14px;
border:1px solid rgba(255,255,255,.06);
}

.property-title{
font-size:18px;
font-weight:bold;
margin-bottom:6px;
}

.muted{
color:#cbd5e1;
font-size:14px;
}

.badge{
display:inline-block;
background:#22c55e;
color:black;
padding:4px 8px;
border-radius:999px;
font-size:12px;
margin-top:6px;
font-weight:bold;
}

@media(max-width:900px){

.search-grid{
grid-template-columns:1fr;
}

.hero h1{
font-size:26px;
}

}

</style>
</head>

<body>

<div class="wrap">

<div class="topbar">

<div class="brand">Imobia</div>

<div class="actions">
<a class="btn ghost" href="./anunciar.html">Anunciar imóvel</a>
<a class="btn ghost" href="./imobia-ai.html">Imobia AI</a>
<a class="btn primary" href="./app.html">Entrar</a>
<a class="btn outline" href="./app.html">Criar conta</a>
</div>

</div>

<div class="hero">
<h1>Encontre seu próximo imóvel</h1>
<p>Busque casas, apartamentos, terrenos e imóveis comerciais em um só lugar.</p>
</div>

<div class="card">

<div class="search-card">

<h2 style="margin-top:0;">Buscar imóveis</h2>

<div class="search-grid">

<input id="city" placeholder="Cidade">

<select id="type">
<option value="">Tipo</option>
<option value="house">Casa</option>
<option value="apartment">Apartamento</option>
<option value="land">Terreno</option>
<option value="commercial">Comercial</option>
</select>

<select id="purpose">
<option value="">Venda ou aluguel</option>
<option value="sale">Venda</option>
<option value="rent">Aluguel</option>
</select>

<input id="price" type="number" placeholder="Preço máximo">

</div>

<button class="primary" style="margin-top:12px;" onclick="searchProperties()">
Buscar
</button>

</div>

</div>

<div class="card">

<h2 style="margin-top:0;">Imóveis encontrados</h2>

<div id="list" class="results">
Carregando imóveis...
</div>

</div>

</div>

<script>

function money(v){
if(!v)return "-";
return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function labelType(v){
if(v==="house")return"Casa";
if(v==="apartment")return"Apartamento";
if(v==="land")return"Terreno";
if(v==="commercial")return"Comercial";
return v||"-";
}

function labelPurpose(v){
if(v==="sale")return"Venda";
if(v==="rent")return"Aluguel";
return v||"-";
}

async function searchProperties(){

const city=document.getElementById("city").value.trim();
const type=document.getElementById("type").value;
const purpose=document.getElementById("purpose").value;
const price=document.getElementById("price").value;

let query=supabase
.from("properties")
.select("*")
.eq("is_public",true)
.order("created_at",{ascending:false});

if(city)query=query.ilike("city","%"+city+"%");
if(type)query=query.eq("property_type",type);
if(purpose)query=query.eq("purpose",purpose);

const {data,error}=await query;

if(error){
document.getElementById("list").innerHTML=error.message;
return;
}

let items=data||[];

if(price){
items=items.filter(p=>Number(p.price||0)<=Number(price));
}

render(items);

}

function render(items){

if(!items.length){
document.getElementById("list").innerHTML="Nenhum imóvel encontrado.";
return;
}

document.getElementById("list").innerHTML=items.map(p=>`

<div class="property">

<div class="property-title">${p.title||"Imóvel"}</div>

<div class="muted">

${labelType(p.property_type)} • ${labelPurpose(p.purpose)}<br>
${p.city||"-"}<br>
Preço: ${money(p.price)}

</div>

<span class="badge">${p.status||"Disponível"}</span>

<div style="margin-top:10px">

<a class="btn ghost" href="./imovel.html?id=${p.id}">
Ver imóvel
</a>

</div>

</div>

`).join("");

}

searchProperties();

</script>

</body>
</html>
