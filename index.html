<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imobia • Plataforma Imobiliária Inteligente</title>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

window.supabase = createClient(
"https://SEU_PROJETO.supabase.co",
"sb_publishable_bFrxuAZOZprjXqrnhrjK2w_i1adudLw"
)
</script>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.wrap{
max-width:1100px;
margin:auto;
padding:20px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.logo{
font-size:24px;
font-weight:bold;
}

.menu{
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
padding:10px 14px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.primary{
background:#22c55e;
color:black;
}

.ghost{
background:#334155;
color:white;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:15px;
}

input,select{
width:100%;
padding:10px;
border-radius:6px;
border:none;
margin-top:6px;
margin-bottom:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:12px;
}

.item{
background:#0b1220;
padding:12px;
border-radius:10px;
border:1px solid rgba(255,255,255,.06);
}

.badge{
background:#22c55e;
padding:4px 8px;
border-radius:20px;
font-size:12px;
color:black;
}

</style>
</head>

<body>

<div class="wrap">

<header>

<div class="logo">Imobia</div>

<div class="menu">

<button class="ghost" onclick="scrollToSection('buscar')">Buscar</button>
<button class="ghost" onclick="scrollToSection('anunciar')">Anunciar imóvel</button>
<button class="ghost" onclick="scrollToSection('ia')">Imobia AI</button>
<button class="primary" onclick="openLogin()">Entrar</button>

</div>

</header>

<div class="card">

<h2>Plataforma imobiliária inteligente</h2>

<p>
A Imobia conecta compradores, corretores e proprietários em uma plataforma com inteligência artificial.
</p>

</div>

<!-- BUSCA -->

<div id="buscar" class="card">

<h3>Buscar imóveis</h3>

<input id="search_city" placeholder="Cidade">

<select id="search_type">
<option value="">Tipo</option>
<option value="house">Casa</option>
<option value="apartment">Apartamento</option>
<option value="land">Terreno</option>
<option value="commercial">Comercial</option>
</select>

<input id="search_price" placeholder="Preço máximo">

<button class="primary" onclick="searchProperties()">Buscar</button>

</div>

<div class="card">

<h3>Resultados</h3>

<div id="property_list" class="grid"></div>

</div>

<!-- ANUNCIAR -->

<div id="anunciar" class="card">

<h3>Anunciar meu imóvel</h3>

<input id="owner_name" placeholder="Seu nome">

<input id="owner_phone" placeholder="Telefone">

<input id="property_title" placeholder="Título do imóvel">

<select id="property_type">
<option value="house">Casa</option>
<option value="apartment">Apartamento</option>
<option value="land">Terreno</option>
<option value="commercial">Comercial</option>
</select>

<select id="property_purpose">
<option value="sale">Venda</option>
<option value="rent">Aluguel</option>
</select>

<input id="property_price" placeholder="Preço">

<input id="property_city" placeholder="Cidade">

<button class="primary" onclick="submitProperty()">Enviar imóvel</button>

</div>

<!-- IA -->

<div id="ia" class="card">

<h3>Falar com Imobia AI</h3>

<input id="ai_question" placeholder="Ex: quero apartamento até 400 mil">

<button class="primary" onclick="askAI()">Perguntar</button>

<div id="ai_response" class="item" style="margin-top:10px">

A Imobia AI pode sugerir imóveis, analisar terrenos e ajudar na busca.

</div>

</div>

</div>

<script>

function scrollToSection(id){
document.getElementById(id).scrollIntoView({behavior:"smooth"})
}

function openLogin(){
location.href="app.html"
}

async function searchProperties(){

const city=document.getElementById("search_city").value
const type=document.getElementById("search_type").value

let query=supabase
.from("properties")
.select("*")
.eq("is_public",true)

if(city) query=query.ilike("city","%"+city+"%")
if(type) query=query.eq("property_type",type)

const {data,error}=await query

const list=document.getElementById("property_list")

list.innerHTML=""

if(!data || data.length===0){
list.innerHTML="<div>Nenhum imóvel encontrado</div>"
return
}

data.forEach(p=>{

list.innerHTML+=`
<div class="item">

<b>${p.title}</b><br>

Cidade: ${p.city || "-"}<br>

Preço: ${p.price || "-"}<br>

<span class="badge">${p.property_type}</span>

</div>
`

})

}

async function submitProperty(){

const name=document.getElementById("owner_name").value
const phone=document.getElementById("owner_phone").value
const title=document.getElementById("property_title").value
const type=document.getElementById("property_type").value
const purpose=document.getElementById("property_purpose").value
const price=document.getElementById("property_price").value
const city=document.getElementById("property_city").value

const {error}=await supabase
.from("property_submissions")
.insert({
title,
property_type:type,
purpose,
price,
city,
owner_name:name,
owner_phone:phone
})

if(error){
alert(error.message)
return
}

alert("Imóvel enviado para análise")

}

async function askAI(){

const q=document.getElementById("ai_question").value

const box=document.getElementById("ai_response")

box.innerHTML="Pensando..."

setTimeout(()=>{

box.innerHTML="A Imobia AI analisará sua busca e sugerirá imóveis compatíveis."

},1000)

}

searchProperties()

</script>

</body>
</html>
