<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imobia • Imóveis</title>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    window.supabase = createClient(
      "https://SEU_PROJETO.supabase.co",
      "SUA_ANON_KEY"
    );
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 4px;
    }

    .card {
      background: #1e293b;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }

    .item {
      background: #0b1220;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.06);
      margin-top: 10px;
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
      min-width: 140px;
    }

    input, select, textarea {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 11px 12px;
      margin-top: 8px;
      margin-bottom: 10px;
      font-size: 15px;
      background: white;
      color: black;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button, a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
    }

    .primary {
      background: #22c55e;
      color: black;
    }

    .ghost {
      background: #334155;
      color: white;
    }

    .danger {
      background: #ef4444;
      color: white;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
      background: #22c55e;
      color: black;
    }

    .muted {
      color: #cbd5e1;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .brand {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">Imobia</div>
        <div class="subtitle" id="page_subtitle">Carregando imóveis...</div>
      </div>

      <div class="row" style="max-width:460px;width:100%;">
        <a class="btn ghost" href="./index.html">Portal</a>
        <a class="btn ghost" href="./dashboard.html">Dashboard</a>
        <button class="ghost" onclick="loadPage()">Atualizar</button>
        <button class="danger" onclick="logout()">Sair</button>
      </div>
    </div>

    <div id="create_block" class="card hidden">
      <h3 style="margin-top:0;">Novo imóvel</h3>

      <input id="title" placeholder="Título do imóvel" />

      <div class="row">
        <select id="property_type">
          <option value="house">Casa</option>
          <option value="apartment">Apartamento</option>
          <option value="land">Terreno</option>
          <option value="commercial">Comercial</option>
        </select>

        <select id="purpose">
          <option value="sale">Venda</option>
          <option value="rent">Aluguel</option>
        </select>
      </div>

      <div class="row">
        <input id="price" type="number" step="0.01" placeholder="Preço" />
        <select id="status">
          <option value="available">Disponível</option>
          <option value="reserved">Reservado</option>
          <option value="sold">Vendido</option>
          <option value="rented">Alugado</option>
        </select>
      </div>

      <div class="row">
        <input id="address" placeholder="Endereço" />
        <input id="neighborhood" placeholder="Bairro" />
      </div>

      <div class="row">
        <input id="city" placeholder="Cidade" />
        <input id="state" placeholder="Estado" />
        <input id="zip_code" placeholder="CEP" />
      </div>

      <div class="row">
        <input id="area_m2" type="number" step="0.01" placeholder="Área m²" />
        <input id="bedrooms" type="number" placeholder="Quartos" />
        <input id="bathrooms" type="number" placeholder="Banheiros" />
        <input id="garage_spots" type="number" placeholder="Vagas" />
      </div>

      <textarea id="description" placeholder="Descrição"></textarea>

      <div class="row">
        <select id="is_public">
          <option value="true">Público</option>
          <option value="false">Privado</option>
        </select>
      </div>

      <button class="primary" onclick="createProperty()">Salvar imóvel</button>
      <div id="create_result"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Filtros</h3>

      <div class="row">
        <input id="filter_city" placeholder="Cidade" />
        <select id="filter_type">
          <option value="">Todos os tipos</option>
          <option value="house">Casa</option>
          <option value="apartment">Apartamento</option>
          <option value="land">Terreno</option>
          <option value="commercial">Comercial</option>
        </select>
        <select id="filter_purpose">
          <option value="">Venda ou aluguel</option>
          <option value="sale">Venda</option>
          <option value="rent">Aluguel</option>
        </select>
        <select id="filter_status">
          <option value="">Todos os status</option>
          <option value="available">Disponível</option>
          <option value="reserved">Reservado</option>
          <option value="sold">Vendido</option>
          <option value="rented">Alugado</option>
        </select>
      </div>

      <button class="ghost" onclick="loadProperties()">Aplicar filtros</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Lista de imóveis</h3>
      <div id="properties_list">Carregando...</div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentProfile = null;

    async function logout() {
      await supabase.auth.signOut();
      location.href = "./app.html";
    }

    async function getSession() {
      const { data } = await supabase.auth.getSession();
      return data.session;
    }

    async function getUser() {
      const { data } = await supabase.auth.getUser();
      return data.user;
    }

    async function getProfile() {
      const { data, error } = await supabase
        .from("imobix_users")
        .select("*, imobix_companies(name)")
        .eq("user_id", currentUser.id)
        .eq("active", true)
        .limit(1)
        .maybeSingle();

      if (error || !data) return null;
      return data;
    }

    function canCreateOrEdit() {
      return ["admin", "broker"].includes(currentProfile?.role);
    }

    function roleLabel(role) {
      if (role === "admin") return "Admin";
      if (role === "broker") return "Corretor";
      if (role === "client") return "Cliente";
      if (role === "owner") return "Proprietário";
      return role || "-";
    }

    function formatMoney(v) {
      if (v === null || v === undefined || v === "") return "-";
      return Number(v).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function propertyTypeLabel(v) {
      if (v === "house") return "Casa";
      if (v === "apartment") return "Apartamento";
      if (v === "land") return "Terreno";
      if (v === "commercial") return "Comercial";
      return v || "-";
    }

    function purposeLabel(v) {
      if (v === "sale") return "Venda";
      if (v === "rent") return "Aluguel";
      return v || "-";
    }

    function statusLabel(v) {
      if (v === "available") return "Disponível";
      if (v === "reserved") return "Reservado";
      if (v === "sold") return "Vendido";
      if (v === "rented") return "Alugado";
      return v || "-";
    }

    async function createProperty() {
      const box = document.getElementById("create_result");

      const payload = {
        company_id: currentProfile.company_id,
        title: document.getElementById("title").value.trim(),
        property_type: document.getElementById("property_type").value,
        purpose: document.getElementById("purpose").value,
        price: document.getElementById("price").value ? Number(document.getElementById("price").value) : null,
        address: document.getElementById("address").value.trim() || null,
        neighborhood: document.getElementById("neighborhood").value.trim() || null,
        city: document.getElementById("city").value.trim() || null,
        state: document.getElementById("state").value.trim() || null,
        zip_code: document.getElementById("zip_code").value.trim() || null,
        area_m2: document.getElementById("area_m2").value ? Number(document.getElementById("area_m2").value) : null,
        bedrooms: document.getElementById("bedrooms").value ? Number(document.getElementById("bedrooms").value) : null,
        bathrooms: document.getElementById("bathrooms").value ? Number(document.getElementById("bathrooms").value) : null,
        garage_spots: document.getElementById("garage_spots").value ? Number(document.getElementById("garage_spots").value) : null,
        description: document.getElementById("description").value.trim() || null,
        status: document.getElementById("status").value,
        is_public: document.getElementById("is_public").value === "true",
        broker_user_id: currentProfile.role === "broker" ? currentUser.id : null,
        created_by: currentUser.id
      };

      if (!payload.title) {
        box.innerHTML = `<div class="item">Informe o título do imóvel.</div>`;
        return;
      }

      const { error } = await supabase.from("properties").insert(payload);

      if (error) {
        box.innerHTML = `<div class="item">${error.message}</div>`;
        return;
      }

      box.innerHTML = `<div class="item">Imóvel salvo com sucesso.</div>`;
      clearCreateForm();
      await loadProperties();
    }

    function clearCreateForm() {
      document.getElementById("title").value = "";
      document.getElementById("price").value = "";
      document.getElementById("address").value = "";
      document.getElementById("neighborhood").value = "";
      document.getElementById("city").value = "";
      document.getElementById("state").value = "";
      document.getElementById("zip_code").value = "";
      document.getElementById("area_m2").value = "";
      document.getElementById("bedrooms").value = "";
      document.getElementById("bathrooms").value = "";
      document.getElementById("garage_spots").value = "";
      document.getElementById("description").value = "";
    }

    async function updatePropertyField(id, field, value) {
      if (!canCreateOrEdit()) return;

      const payload = {};
      payload[field] = value;

      const { error } = await supabase
        .from("properties")
        .update(payload)
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      await loadProperties();
    }

    async function loadProperties() {
      const city = document.getElementById("filter_city").value.trim();
      const type = document.getElementById("filter_type").value;
      const purpose = document.getElementById("filter_purpose").value;
      const status = document.getElementById("filter_status").value;

      let query = supabase
        .from("properties")
        .select("*")
        .order("created_at", { ascending: false });

      if (currentProfile.role === "broker") {
        query = query.eq("broker_user_id", currentUser.id);
      }

      if (currentProfile.role === "client") {
        query = query.eq("is_public", true);
      }

      if (currentProfile.role === "owner") {
        query = query.eq("owner_user_id", currentUser.id);
      }

      if (city) query = query.ilike("city", `%${city}%`);
      if (type) query = query.eq("property_type", type);
      if (purpose) query = query.eq("purpose", purpose);
      if (status) query = query.eq("status", status);

      const { data, error } = await query;
      const box = document.getElementById("properties_list");

      if (error) {
        box.innerHTML = `<div class="item">${error.message}</div>`;
        return;
      }

      if (!data || !data.length) {
        box.innerHTML = `<div class="item">Nenhum imóvel encontrado.</div>`;
        return;
      }

      box.innerHTML = data.map(p => {
        const editableBlock = canCreateOrEdit()
          ? `
            <div class="row" style="margin-top:10px;">
              <select onchange="updatePropertyField('${p.id}','status',this.value)">
                <option value="available" ${p.status === "available" ? "selected" : ""}>Disponível</option>
                <option value="reserved" ${p.status === "reserved" ? "selected" : ""}>Reservado</option>
                <option value="sold" ${p.status === "sold" ? "selected" : ""}>Vendido</option>
                <option value="rented" ${p.status === "rented" ? "selected" : ""}>Alugado</option>
              </select>

              <select onchange="updatePropertyField('${p.id}','is_public',this.value === 'true')">
                <option value="true" ${p.is_public ? "selected" : ""}>Público</option>
                <option value="false" ${!p.is_public ? "selected" : ""}>Privado</option>
              </select>
            </div>
          `
          : "";

        return `
          <div class="item">
            <b>${p.title}</b><br>
            ${propertyTypeLabel(p.property_type)} • ${purposeLabel(p.purpose)}<br>
            ${p.city || "-"}${p.neighborhood ? " • " + p.neighborhood : ""}<br>
            Preço: ${formatMoney(p.price)}<br>
            Área: ${p.area_m2 || "-"} m²<br>
            Quartos: ${p.bedrooms || "-"} • Banheiros: ${p.bathrooms || "-"} • Vagas: ${p.garage_spots || "-"}<br>
            ${p.description ? `<div class="muted" style="margin-top:8px;">${p.description}</div>` : ""}
            <span class="badge">${statusLabel(p.status)}</span>
            <span class="badge">${p.is_public ? "Público" : "Privado"}</span>
            ${editableBlock}
          </div>
        `;
      }).join("");
    }

    async function loadPage() {
      const session = await getSession();

      if (!session) {
        location.href = "./app.html";
        return;
      }

      currentUser = await getUser();
      currentProfile = await getProfile();

      if (!currentProfile) {
        location.href = "./app.html";
        return;
      }

      document.getElementById("page_subtitle").textContent =
        `${currentProfile.imobix_companies?.name || "Imobiliária"} • ${roleLabel(currentProfile.role)}`;

      if (canCreateOrEdit()) {
        document.getElementById("create_block").classList.remove("hidden");
      } else {
        document.getElementById("create_block").classList.add("hidden");
      }

      await loadProperties();
    }

    loadPage();

    window.logout = logout;
    window.loadPage = loadPage;
    window.createProperty = createProperty;
    window.updatePropertyField = updatePropertyField;
    window.loadProperties = loadProperties;
  </script>
</body>
</html>
