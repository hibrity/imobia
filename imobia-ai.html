<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Imobia AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .wrap {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
    }

    .danger {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .primary {
      background: #22c55e;
      color: black;
    }

    .chip {
      background: #334155;
      color: white;
    }

    .item {
      margin-top: 10px;
      background: #0b1220;
      padding: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- TOPO -->
    <div class="topbar">
      <div class="title">Imobia AI</div>

      <button class="danger" onclick="logout()">Sair</button>
    </div>

    <!-- CARD -->
    <div class="card">

      <button class="btn primary">Abrir chat</button>

      <div>
        <button class="btn chip">Apartamento</button>
        <button class="btn chip">Aluguel</button>
        <button class="btn chip">Terreno</button>
      </div>

      <h3 style="margin-top:20px;">Imóveis sugeridos</h3>

      <div class="item">
        Nenhum ainda
      </div>

    </div>

  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://bcfjciljugeascgyokxa.supabase.co",
      "sb_publishable_bFrxuAZOZprjXqrnhrjK2w_i1adudLw"
    );

    // 🔥 LOGOUT CORRIGIDO
    async function logout() {
      await supabase.auth.signOut();

      // limpeza extra (garantia)
      localStorage.clear();
      sessionStorage.clear();

      // redireciona corretamente
      window.location.replace("./index.html");
    }

    // deixa acessível no HTML
    window.logout = logout;

  </script>
</body>
</html>
