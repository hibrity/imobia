<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Imobia • IA</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.brand{font-size:28px;font-weight:bold}

.actions{
  display:flex;
  gap:8px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:16px;
}

button{
  border:none;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
}

.primary{background:#22c55e;color:black}
.ghost{background:#334155;color:white}
.danger{background:#ef4444;color:white}
.warning{background:#f59e0b;color:black}

.chips{
  margin-top:10px;
}

.chip{
  background:#334155;
  padding:8px 10px;
  border-radius:999px;
  margin:4px;
  display:inline-block;
  cursor:pointer;
  font-size:13px;
}

.section{
  margin-top:18px;
}

.chat{
  max-height:300px;
  overflow:auto;
  margin-top:10px;
}

.msg{
  padding:10px;
  border-radius:10px;
  margin-top:8px;
  max-width:80%;
}

.user{
  background:#22c55e;
  color:black;
  margin-left:auto;
}

.ai{
  background:#0b1220;
}

input,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:10px;
}

.hidden{display:none}

.property{
  background:#0b1220;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}

.badge{
  background:#22c55e;
  color:black;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="topbar">
    <div class="brand">Imobia</div>
    <div class="actions">
      <button class="ghost" onclick="location.href='index.html'">Portal</button>
      <button class="ghost">Dashboard</button>
      <button class="danger">Sair</button>
    </div>
  </div>

  <div class="card">

    <h2>Imobia AI</h2>

    <div class="actions">
      <button class="primary" onclick="toggleChat()">Abrir chat</button>
      <button class="ghost" onclick="clearChat()">Limpar</button>
    </div>

    <div class="chips">
      <span class="chip" onclick="quick('Quero comprar um apartamento')">Comprar apartamento</span>
      <span class="chip" onclick="quick('Quero alugar imóvel')">Alugar</span>
      <span class="chip" onclick="quick('Quero terreno')">Terreno</span>
      <span class="chip" onclick="quick('Quero imóvel comercial')">Comercial</span>
    </div>

    <div class="section">
      <div class="badge">Resumo IA</div>
      <div id="summary" style="margin-top:6px;">
        A IA pode encontrar imóveis, sugerir investimentos e gerar leads automaticamente.
      </div>
    </div>

    <div id="chat" class="section hidden">
      <div id="chatBox" class="chat"></div>
      <textarea id="msg" placeholder="Digite..."></textarea>
      <button class="primary" onclick="send()">Enviar</button>
    </div>

    <div class="section">
      <div class="badge">Imóveis sugeridos</div>
      <div id="properties">Nenhum ainda</div>
    </div>

    <div class="section">
      <div class="badge">Ações</div>
      <div class="actions">
        <button class="ghost">Agendar visita</button>
        <button class="ghost">Falar com corretor</button>
        <button class="warning">Estimar custo</button>
      </div>
    </div>

  </div>

</div>

<script>

let open = false;

function toggleChat(){
  open = !open;
  document.getElementById("chat").classList.toggle("hidden", !open);
}

function clearChat(){
  document.getElementById("chatBox").innerHTML="";
}

function quick(text){
  document.getElementById("msg").value=text;
  send();
}

function send(){
  const text = document.getElementById("msg").value;
  if(!text) return;

  addMsg("user", text);
  document.getElementById("msg").value="";

  setTimeout(()=>{
    addMsg("ai","Encontrei opções baseadas no seu pedido.");
    mockProperties();
  },500);
}

function addMsg(type,text){
  const box = document.getElementById("chatBox");
  box.innerHTML += `<div class="msg ${type}">${text}</div>`;
  box.scrollTop = box.scrollHeight;
}

function mockProperties(){
  document.getElementById("properties").innerHTML = `
    <div class="property">
      Apartamento • São Paulo<br>
      R$ 450.000
    </div>
    <div class="property">
      Casa • Campinas<br>
      R$ 380.000
    </div>
  `;
}

</script>

</body>
</html>
