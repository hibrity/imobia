<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imobia • Dashboard</title>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    window.supabase = createClient(
      "https://bcfjciljugeascgyokxa.supabase.co",
      "sb_publishable_bFrxuAZOZprjXqrnhrjK2w_i1adudLw"
    );
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 4px;
    }

    .card {
      background: #1e293b;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }

    .item {
      background: #0b1220;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.06);
      margin-top: 10px;
    }

    .stats {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(4, 1fr);
    }

    .stat {
      background: #0b1220;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.06);
    }

    .stat strong {
      display: block;
      margin-top: 6px;
      font-size: 24px;
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
      min-width: 140px;
    }

    button, a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
    }

    .primary {
      background: #22c55e;
      color: black;
    }

    .ghost {
      background: #334155;
      color: white;
    }

    .danger {
      background: #ef4444;
      color: white;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
      background: #22c55e;
      color: black;
    }

    .muted {
      color: #cbd5e1;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .brand {
        font-size: 24px;
      }
    }

    @media (max-width: 640px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">Imobia</div>
        <div class="subtitle" id="page_subtitle">Carregando dashboard...</div>
      </div>

      <div class="row" style="max-width:420px;width:100%;">
        <a class="btn ghost" href="./index.html">Portal</a>
        <a class="btn ghost" href="./app.html">Conta</a>
        <button class="ghost" onclick="loadDashboard()">Atualizar</button>
        <button class="danger" onclick="logout()">Sair</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Resumo</h3>
      <div class="stats" id="stats"></div>
    </div>

    <div class="grid">
      <div>
        <div class="card">
          <h3 style="margin-top:0;">Meu perfil</h3>
          <div id="profile_info" class="item">Carregando...</div>
        </div>

        <div class="card">
          <h3 style="margin-top:0;">Ações rápidas</h3>
          <div id="quick_actions"></div>
        </div>
      </div>

      <div>
        <div class="card">
          <h3 style="margin-top:0;">Atividade principal</h3>
          <div id="activity_box" class="item">Carregando...</div>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3 style="margin-top:0;">Imóveis</h3>
        <div id="properties_list">Carregando...</div>
      </div>

      <div class="card">
        <h3 style="margin-top:0;">Captações</h3>
        <div id="submissions_list">Carregando...</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3 style="margin-top:0;">Clientes</h3>
        <div id="clients_list">Carregando...</div>
      </div>

      <div class="card">
        <h3 style="margin-top:0;">Visitas</h3>
        <div id="visits_list">Carregando...</div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentProfile = null;

    async function logout() {
      await supabase.auth.signOut();
      location.href = "./app.html";
    }

    async function getSession() {
      const { data } = await supabase.auth.getSession();
      return data.session;
    }

    async function getUser() {
      const { data } = await supabase.auth.getUser();
      return data.user;
    }

    async function getProfile() {
      const { data, error } = await supabase
        .from("imobix_users")
        .select("*, imobix_companies(name, phone, email)")
        .eq("user_id", currentUser.id)
        .eq("active", true)
        .limit(1)
        .maybeSingle();

      if (error || !data) return null;
      return data;
    }

    function roleLabel(role) {
      if (role === "admin") return "Admin";
      if (role === "broker") return "Corretor";
      if (role === "client") return "Cliente";
      if (role === "owner") return "Proprietário";
      return role || "-";
    }

    function renderProfile() {
      const box = document.getElementById("profile_info");
      const companyName = currentProfile.imobix_companies?.name || "-";

      box.innerHTML = `
        <b>${currentProfile.full_name || currentUser.email}</b><br>
        Email: ${currentUser.email}<br>
        Perfil: ${roleLabel(currentProfile.role)}<br>
        Imobiliária: ${companyName}<br>
        <span class="badge">Ativo</span>
      `;

      document.getElementById("page_subtitle").textContent =
        `${companyName} • ${roleLabel(currentProfile.role)}`;
    }

    function renderQuickActions() {
      const box = document.getElementById("quick_actions");
      const role = currentProfile.role;

      if (role === "admin") {
        box.innerHTML = `
          <div class="row">
            <a class="btn primary" href="./imoveis.html">Gerenciar imóveis</a>
            <a class="btn ghost" href="./captacoes.html">Captações</a>
          </div>
          <div class="row" style="margin-top:10px;">
            <a class="btn ghost" href="./corretores.html">Corretores</a>
            <a class="btn ghost" href="./visitas.html">Visitas</a>
          </div>
        `;
        return;
      }

      if (role === "broker") {
        box.innerHTML = `
          <div class="row">
            <a class="btn primary" href="./clientes.html">Meus clientes</a>
            <a class="btn ghost" href="./visitas.html">Minhas visitas</a>
          </div>
          <div class="row" style="margin-top:10px;">
            <a class="btn ghost" href="./imoveis.html">Meus imóveis</a>
            <a class="btn ghost" href="./captacoes.html">Captações</a>
          </div>
        `;
        return;
      }

      if (role === "client") {
        box.innerHTML = `
          <div class="row">
            <a class="btn primary" href="./index.html">Buscar imóveis</a>
            <a class="btn ghost" href="./cliente-home.html">Minha área</a>
          </div>
        `;
        return;
      }

      if (role === "owner") {
        box.innerHTML = `
          <div class="row">
            <a class="btn primary" href="./anunciar.html">Anunciar imóvel</a>
            <a class="btn ghost" href="./meus-imoveis.html">Minhas captações</a>
          </div>
        `;
        return;
      }

      box.innerHTML = `<div class="item">Sem ações disponíveis.</div>`;
    }

    function renderStats(data) {
      document.getElementById("stats").innerHTML = `
        <div class="stat">
          Imóveis
          <strong>${data.properties}</strong>
        </div>
        <div class="stat">
          Captações
          <strong>${data.submissions}</strong>
        </div>
        <div class="stat">
          Clientes
          <strong>${data.clients}</strong>
        </div>
        <div class="stat">
          Visitas
          <strong>${data.visits}</strong>
        </div>
      `;
    }

    function renderActivity(text) {
      document.getElementById("activity_box").innerHTML = text;
    }

    function renderList(targetId, items, mapper, emptyText) {
      const box = document.getElementById(targetId);

      if (!items || !items.length) {
        box.innerHTML = `<div class="item">${emptyText}</div>`;
        return;
      }

      box.innerHTML = items.map(mapper).join("");
    }

    async function loadAdminData() {
      const companyId = currentProfile.company_id;

      const propertiesRes = await supabase
        .from("properties")
        .select("*", { count: "exact" })
        .eq("company_id", companyId);

      const submissionsRes = await supabase
        .from("property_submissions")
        .select("*", { count: "exact" })
        .eq("company_id", companyId);

      const clientsRes = await supabase
        .from("property_clients")
        .select("*", { count: "exact" })
        .eq("company_id", companyId);

      const visitsRes = await supabase
        .from("property_visits")
        .select("*", { count: "exact" })
        .eq("company_id", companyId);

      renderStats({
        properties: propertiesRes.count || 0,
        submissions: submissionsRes.count || 0,
        clients: clientsRes.count || 0,
        visits: visitsRes.count || 0
      });

      renderActivity(`
        <b>Visão do administrador</b><br>
        Acompanhe imóveis, captações, clientes, visitas e a operação da imobiliária.
      `);

      renderList(
        "properties_list",
        (propertiesRes.data || []).slice(0, 8),
        p => `
          <div class="item">
            <b>${p.title}</b><br>
            ${p.city || "-"} • ${p.property_type}<br>
            Preço: ${p.price ?? "-"}<br>
            <span class="badge">${p.status}</span>
          </div>
        `,
        "Nenhum imóvel cadastrado."
      );

      renderList(
        "submissions_list",
        (submissionsRes.data || []).slice(0, 8),
        s => `
          <div class="item">
            <b>${s.title}</b><br>
            ${s.city || "-"} • ${s.property_type}<br>
            Proprietário: ${s.owner_name || "-"}<br>
            <span class="badge">${s.status}</span>
          </div>
        `,
        "Nenhuma captação recebida."
      );

      renderList(
        "clients_list",
        (clientsRes.data || []).slice(0, 8),
        c => `
          <div class="item">
            <b>${c.full_name}</b><br>
            ${c.phone || "-"}<br>
            Interesse: ${c.interest_type || "-"}
          </div>
        `,
        "Nenhum cliente cadastrado."
      );

      renderList(
        "visits_list",
        (visitsRes.data || []).slice(0, 8),
        v => `
          <div class="item">
            <b>Visita agendada</b><br>
            Data: ${new Date(v.visit_date).toLocaleString("pt-BR")}<br>
            <span class="badge">${v.status}</span>
          </div>
        `,
        "Nenhuma visita cadastrada."
      );
    }

    async function loadBrokerData() {
      const companyId = currentProfile.company_id;

      const propertiesRes = await supabase
        .from("properties")
        .select("*", { count: "exact" })
        .eq("company_id", companyId)
        .eq("broker_user_id", currentUser.id);

      const submissionsRes = await supabase
        .from("property_submissions")
        .select("*", { count: "exact" })
        .eq("company_id", companyId)
        .eq("assigned_broker_user_id", currentUser.id);

      const clientsRes = await supabase
        .from("property_clients")
        .select("*", { count: "exact" })
        .eq("company_id", companyId)
        .eq("assigned_broker_user_id", currentUser.id);

      const visitsRes = await supabase
        .from("property_visits")
        .select("*", { count: "exact" })
        .eq("company_id", companyId)
        .eq("broker_user_id", currentUser.id);

      renderStats({
        properties: propertiesRes.count || 0,
        submissions: submissionsRes.count || 0,
        clients: clientsRes.count || 0,
        visits: visitsRes.count || 0
      });

      renderActivity(`
        <b>Visão do corretor</b><br>
        Aqui você acompanha seus imóveis, clientes, visitas e captações atribuídas.
      `);

      renderList(
        "properties_list",
        (propertiesRes.data || []).slice(0, 8),
        p => `
          <div class="item">
            <b>${p.title}</b><br>
            ${p.city || "-"} • ${p.property_type}<br>
            Preço: ${p.price ?? "-"}<br>
            <span class="badge">${p.status}</span>
          </div>
        `,
        "Nenhum imóvel atribuído a você."
      );

      renderList(
        "submissions_list",
        (submissionsRes.data || []).slice(0, 8),
        s => `
          <div class="item">
            <b>${s.title}</b><br>
            ${s.city || "-"} • ${s.property_type}<br>
            Status: <span class="badge">${s.status}</span>
          </div>
        `,
        "Nenhuma captação atribuída."
      );

      renderList(
        "clients_list",
        (clientsRes.data || []).slice(0, 8),
        c => `
          <div class="item">
            <b>${c.full_name}</b><br>
            ${c.phone || "-"}<br>
            Interesse: ${c.interest_type || "-"}
          </div>
        `,
        "Nenhum cliente atribuído."
      );

      renderList(
        "visits_list",
        (visitsRes.data || []).slice(0, 8),
        v => `
          <div class="item">
            <b>Visita</b><br>
            ${new Date(v.visit_date).toLocaleString("pt-BR")}<br>
            <span class="badge">${v.status}</span>
          </div>
        `,
        "Nenhuma visita atribuída."
      );
    }

    async function loadClientData() {
      const companyId = currentProfile.company_id;

      const interestRes = await supabase
        .from("property_interest")
        .select("*", { count: "exact" })
        .eq("company_id", companyId)
        .eq("client_user_id", currentUser.id);

      const clientRecordRes = await supabase
        .from("property_clients")
        .select("*")
        .eq("company_id", companyId)
        .eq("user_id", currentUser.id)
        .limit(1)
        .maybeSingle();

      let visitsRes = { data: [], count: 0 };
      if (clientRecordRes.data?.id) {
        visitsRes = await supabase
          .from("property_visits")
          .select("*", { count: "exact" })
          .eq("company_id", companyId)
          .eq("client_id", clientRecordRes.data.id);
      }

      const publicPropertiesRes = await supabase
        .from("properties")
        .select("*", { count: "exact" })
        .eq("company_id", companyId)
        .eq("is_public", true);

      renderStats({
        properties: publicPropertiesRes.count || 0,
        submissions: interestRes.count || 0,
        clients: clientRecordRes.data ? 1 : 0,
        visits: visitsRes.count || 0
      });

      renderActivity(`
        <b>Visão do cliente</b><br>
        Busque imóveis, acompanhe seus interesses e veja visitas agendadas.
      `);

      renderList(
        "properties_list",
        (publicPropertiesRes.data || []).slice(0, 8),
        p => `
          <div class="item">
            <b>${p.title}</b><br>
            ${p.city || "-"} • ${p.property_type}<br>
            Preço: ${p.price ?? "-"}<br>
            <span class="badge">${p.status}</span>
          </div>
        `,
        "Nenhum imóvel público disponível."
      );

      renderList(
        "submissions_list",
        (interestRes.data || []).slice(0, 8),
        i => `
          <div class="item">
            <b>Interesse enviado</b><br>
            Status: ${i.status}<br>
            ${i.message || ""}
          </div>
        `,
        "Você ainda não demonstrou interesse em imóveis."
      );

      renderList(
        "clients_list",
        clientRecordRes.data ? [clientRecordRes.data] : [],
        c => `
          <div class="item">
            <b>${c.full_name}</b><br>
            ${c.phone || "-"}<br>
            Interesse: ${c.interest_type || "-"}
          </div>
        `,
        "Seu cadastro de cliente ainda não foi criado."
      );

      renderList(
        "visits_list",
        (visitsRes.data || []).slice(0, 8),
        v => `
          <div class="item">
            <b>Visita</b><br>
            ${new Date(v.visit_date).toLocaleString("pt-BR")}<br>
            <span class="badge">${v.status}</span>
          </div>
        `,
        "Nenhuma visita agendada para você."
      );
    }

    async function loadOwnerData() {
      const companyId = currentProfile.company_id;

      const submissionsRes = await supabase
        .from("property_submissions")
        .select("*", { count: "exact" })
        .eq("company_id", companyId)
        .eq("owner_user_id", currentUser.id);

      const propertiesRes = await supabase
        .from("properties")
        .select("*", { count: "exact" })
        .eq("company_id", companyId)
        .eq("owner_user_id", currentUser.id);

      renderStats({
        properties: propertiesRes.count || 0,
        submissions: submissionsRes.count || 0,
        clients: 0,
        visits: 0
      });

      renderActivity(`
        <b>Visão do proprietário</b><br>
        Aqui você acompanha seus imóveis enviados e os anúncios já aprovados pela imobiliária.
      `);

      renderList(
        "properties_list",
        (propertiesRes.data || []).slice(0, 8),
        p => `
          <div class="item">
            <b>${p.title}</b><br>
            ${p.city || "-"} • ${p.property_type}<br>
            Preço: ${p.price ?? "-"}<br>
            <span class="badge">${p.status}</span>
          </div>
        `,
        "Nenhum imóvel oficial vinculado ao seu usuário."
      );

      renderList(
        "submissions_list",
        (submissionsRes.data || []).slice(0, 8),
        s => `
          <div class="item">
            <b>${s.title}</b><br>
            ${s.city || "-"} • ${s.property_type}<br>
            <span class="badge">${s.status}</span>
          </div>
        `,
        "Nenhuma captação enviada."
      );

      renderList(
        "clients_list",
        [],
        () => "",
        "Esta área não se aplica ao perfil de proprietário."
      );

      renderList(
        "visits_list",
        [],
        () => "",
        "As visitas do proprietário são acompanhadas pela imobiliária."
      );
    }

    async function loadDashboard() {
      const session = await getSession();

      if (!session) {
        location.href = "./app.html";
        return;
      }

      currentUser = await getUser();
      currentProfile = await getProfile();

      if (!currentProfile) {
        location.href = "./app.html";
        return;
      }

      renderProfile();
      renderQuickActions();

      if (currentProfile.role === "admin") {
        await loadAdminData();
        return;
      }

      if (currentProfile.role === "broker") {
        await loadBrokerData();
        return;
      }

      if (currentProfile.role === "client") {
        await loadClientData();
        return;
      }

      if (currentProfile.role === "owner") {
        await loadOwnerData();
        return;
      }

      renderActivity("Perfil sem dashboard definido.");
    }

    loadDashboard();

    window.logout = logout;
    window.loadDashboard = loadDashboard;
  </script>
</body>
</html>
