<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imobia • Anunciar imóvel</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 4px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      margin-bottom: 16px;
    }

    .item {
      background: #0b1220;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.06);
      margin-top: 10px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
      min-width: 140px;
    }

    input, select, textarea {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      background: white;
      color: black;
      margin-top: 8px;
      margin-bottom: 10px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button, a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
    }

    .primary {
      background: #22c55e;
      color: black;
    }

    .ghost {
      background: #334155;
      color: white;
    }

    .danger {
      background: #ef4444;
      color: white;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">Imobia</div>
        <div class="subtitle">Anunciar imóvel como cliente</div>
      </div>

      <div class="top-actions">
        <a class="btn ghost" href="./index.html">Portal</a>
        <a class="btn ghost" href="./cliente-home.html">Área do cliente</a>
        <button class="danger" onclick="logout()">Sair</button>
      </div>
    </div>

    <div id="access_block" class="card hidden">
      <h2 style="margin-top:0;">Acesso necessário</h2>
      <div class="item">
        Para anunciar imóvel você precisa estar logado como <b>cliente</b>.
      </div>
      <div class="row" style="margin-top:12px;">
        <a class="btn primary" href="./app.html?mode=signup&role=client&next=anunciar.html">Entrar / criar conta como cliente</a>
        <a class="btn ghost" href="./index.html">Voltar ao portal</a>
      </div>
    </div>

    <div id="form_block" class="hidden">
      <div class="card">
        <h2 style="margin-top:0;">Enviar imóvel para análise</h2>

        <input id="title" placeholder="Título do imóvel" />

        <div class="row">
          <select id="property_type">
            <option value="house">Casa</option>
            <option value="apartment">Apartamento</option>
            <option value="land">Terreno</option>
            <option value="commercial">Comercial</option>
          </select>

          <select id="purpose">
            <option value="sale">Venda</option>
            <option value="rent">Aluguel</option>
          </select>
        </div>

        <div class="row">
          <input id="price" type="number" step="0.01" placeholder="Preço sugerido" />
          <input id="area_m2" type="number" step="0.01" placeholder="Área m²" />
        </div>

        <div class="row">
          <input id="address" placeholder="Endereço" />
          <input id="neighborhood" placeholder="Bairro" />
        </div>

        <div class="row">
          <input id="city" placeholder="Cidade" />
          <input id="state" placeholder="Estado" />
          <input id="zip_code" placeholder="CEP" />
        </div>

        <textarea id="description" placeholder="Descreva o imóvel"></textarea>

        <button class="primary" onclick="submitProperty()">Enviar para análise</button>

        <div id="result"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://bcfjciljugeascgyokxa.supabase.co",
      "sb_publishable_bFrxuAZOZprjXqrnhrjK2w_i1adudLw"
    );

    let currentUser = null;
    let currentProfile = null;

    async function logout() {
      await supabase.auth.signOut();
      location.href = "./app.html";
    }

    async function getUser() {
      const { data } = await supabase.auth.getUser();
      return data.user;
    }

    async function getProfile(userId) {
      const { data } = await supabase
        .from("imobix_users")
        .select("*")
        .eq("user_id", userId)
        .eq("active", true)
        .limit(1)
        .maybeSingle();

      return data || null;
    }

    async function loadPage() {
      currentUser = await getUser();

      if (!currentUser) {
        document.getElementById("access_block").classList.remove("hidden");
        document.getElementById("form_block").classList.add("hidden");
        return;
      }

      currentProfile = await getProfile(currentUser.id);

      if (!currentProfile || currentProfile.role !== "client") {
        document.getElementById("access_block").classList.remove("hidden");
        document.getElementById("form_block").classList.add("hidden");
        return;
      }

      document.getElementById("access_block").classList.add("hidden");
      document.getElementById("form_block").classList.remove("hidden");
    }

    async function submitProperty() {
      const box = document.getElementById("result");

      const payload = {
        company_id: null,
        owner_user_id: currentUser.id,
        owner_name: currentProfile.full_name || currentUser.email,
        owner_email: currentUser.email || null,
        owner_phone: currentProfile.phone || null,
        title: document.getElementById("title").value.trim(),
        property_type: document.getElementById("property_type").value,
        purpose: document.getElementById("purpose").value,
        price: document.getElementById("price").value ? Number(document.getElementById("price").value) : null,
        area_m2: document.getElementById("area_m2").value ? Number(document.getElementById("area_m2").value) : null,
        address: document.getElementById("address").value.trim() || null,
        neighborhood: document.getElementById("neighborhood").value.trim() || null,
        city: document.getElementById("city").value.trim() || null,
        state: document.getElementById("state").value.trim() || null,
        zip_code: document.getElementById("zip_code").value.trim() || null,
        description: document.getElementById("description").value.trim() || null,
        status: "pending",
        created_by: currentUser.id
      };

      box.innerHTML = "";

      if (!payload.title) {
        box.innerHTML = `<div class="item">Informe o título do imóvel.</div>`;
        return;
      }

      const { error } = await supabase
        .from("property_submissions")
        .insert(payload);

      if (error) {
        box.innerHTML = `<div class="item">${error.message}</div>`;
        return;
      }

      box.innerHTML = `<div class="item">Imóvel enviado para análise com sucesso.</div>`;
    }

    loadPage();

    window.logout = logout;
    window.submitProperty = submitProperty;
  </script>
</body>
</html>
