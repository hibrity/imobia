<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imobia • Anunciar imóvel</title>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    window.supabase = createClient(
      "https://SEU_PROJETO.supabase.co",
      "SUA_ANON_KEY"
    );
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 4px;
    }

    .card {
      background: #1e293b;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }

    .item {
      background: #0b1220;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.06);
      margin-top: 10px;
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
      min-width: 140px;
    }

    input, select, textarea {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 11px 12px;
      margin-top: 8px;
      margin-bottom: 10px;
      font-size: 15px;
      background: white;
      color: black;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button, a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
    }

    .primary {
      background: #22c55e;
      color: black;
    }

    .ghost {
      background: #334155;
      color: white;
    }

    .danger {
      background: #ef4444;
      color: white;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
      background: #22c55e;
      color: black;
    }

    .muted {
      color: #cbd5e1;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .brand {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">Imobia</div>
        <div class="subtitle" id="page_subtitle">Envie seu imóvel para análise da imobiliária</div>
      </div>

      <div class="row" style="max-width:460px;width:100%;">
        <a class="btn ghost" href="./index.html">Portal</a>
        <a class="btn ghost" href="./app.html">Conta</a>
        <button class="ghost" onclick="loadPage()">Atualizar</button>
        <button class="danger" onclick="logout()">Sair</button>
      </div>
    </div>

    <div class="grid">
      <div>
        <div class="card">
          <h3 style="margin-top:0;">Anunciar meu imóvel</h3>

          <input id="title" placeholder="Título do imóvel" />

          <div class="row">
            <select id="property_type">
              <option value="house">Casa</option>
              <option value="apartment">Apartamento</option>
              <option value="land">Terreno</option>
              <option value="commercial">Comercial</option>
            </select>

            <select id="purpose">
              <option value="sale">Venda</option>
              <option value="rent">Aluguel</option>
            </select>
          </div>

          <div class="row">
            <input id="price" type="number" step="0.01" placeholder="Preço desejado" />
            <input id="area_m2" type="number" step="0.01" placeholder="Área m²" />
          </div>

          <div class="row">
            <input id="bedrooms" type="number" placeholder="Quartos" />
            <input id="bathrooms" type="number" placeholder="Banheiros" />
            <input id="garage_spots" type="number" placeholder="Vagas" />
          </div>

          <div class="row">
            <input id="address" placeholder="Endereço" />
            <input id="neighborhood" placeholder="Bairro" />
          </div>

          <div class="row">
            <input id="city" placeholder="Cidade" />
            <input id="state" placeholder="Estado" />
            <input id="zip_code" placeholder="CEP" />
          </div>

          <textarea id="description" placeholder="Descrição do imóvel"></textarea>

          <h3>Dados do proprietário</h3>

          <input id="owner_name" placeholder="Seu nome" />
          <div class="row">
            <input id="owner_phone" placeholder="Seu telefone" />
            <input id="owner_email" type="email" placeholder="Seu email" />
          </div>

          <button class="primary" onclick="submitProperty()">Enviar para análise</button>
          <div id="submit_result"></div>
        </div>
      </div>

      <div>
        <div class="card">
          <h3 style="margin-top:0;">Minhas captações</h3>
          <div id="submissions_list">Carregando...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentProfile = null;
    let currentCompanyId = null;

    async function logout() {
      await supabase.auth.signOut();
      location.href = "./app.html";
    }

    async function getSession() {
      const { data } = await supabase.auth.getSession();
      return data.session;
    }

    async function getUser() {
      const { data } = await supabase.auth.getUser();
      return data.user;
    }

    async function getProfile() {
      const { data } = await supabase
        .from("imobix_users")
        .select("*, imobix_companies(name, email, phone)")
        .eq("user_id", currentUser.id)
        .eq("active", true)
        .limit(1)
        .maybeSingle();

      return data || null;
    }

    async function getFallbackCompany() {
      const { data } = await supabase
        .from("imobix_companies")
        .select("*")
        .order("created_at", { ascending: true })
        .limit(1)
        .maybeSingle();

      return data || null;
    }

    function statusLabel(v) {
      if (v === "pending") return "Pendente";
      if (v === "in_review") return "Em análise";
      if (v === "approved") return "Aprovado";
      if (v === "rejected") return "Rejeitado";
      return v || "-";
    }

    function propertyTypeLabel(v) {
      if (v === "house") return "Casa";
      if (v === "apartment") return "Apartamento";
      if (v === "land") return "Terreno";
      if (v === "commercial") return "Comercial";
      return v || "-";
    }

    function purposeLabel(v) {
      if (v === "sale") return "Venda";
      if (v === "rent") return "Aluguel";
      return v || "-";
    }

    function formatMoney(v) {
      if (v === null || v === undefined || v === "") return "-";
      return Number(v).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function fillOwnerData() {
      if (!currentUser) return;

      const profileName = currentProfile?.full_name || "";
      const profilePhone = currentProfile?.phone || "";
      const profileEmail = currentUser.email || "";

      if (!document.getElementById("owner_name").value) {
        document.getElementById("owner_name").value = profileName;
      }

      if (!document.getElementById("owner_phone").value) {
        document.getElementById("owner_phone").value = profilePhone;
      }

      if (!document.getElementById("owner_email").value) {
        document.getElementById("owner_email").value = profileEmail;
      }
    }

    async function submitProperty() {
      const box = document.getElementById("submit_result");

      const payload = {
        company_id: currentCompanyId,
        owner_user_id: currentUser.id,
        title: document.getElementById("title").value.trim(),
        property_type: document.getElementById("property_type").value,
        purpose: document.getElementById("purpose").value,
        price: document.getElementById("price").value ? Number(document.getElementById("price").value) : null,
        address: document.getElementById("address").value.trim() || null,
        neighborhood: document.getElementById("neighborhood").value.trim() || null,
        city: document.getElementById("city").value.trim() || null,
        state: document.getElementById("state").value.trim() || null,
        zip_code: document.getElementById("zip_code").value.trim() || null,
        area_m2: document.getElementById("area_m2").value ? Number(document.getElementById("area_m2").value) : null,
        bedrooms: document.getElementById("bedrooms").value ? Number(document.getElementById("bedrooms").value) : null,
        bathrooms: document.getElementById("bathrooms").value ? Number(document.getElementById("bathrooms").value) : null,
        garage_spots: document.getElementById("garage_spots").value ? Number(document.getElementById("garage_spots").value) : null,
        description: document.getElementById("description").value.trim() || null,
        owner_name: document.getElementById("owner_name").value.trim() || null,
        owner_phone: document.getElementById("owner_phone").value.trim() || null,
        owner_email: document.getElementById("owner_email").value.trim() || null,
        status: "pending"
      };

      if (!payload.title) {
        box.innerHTML = `<div class="item">Informe o título do imóvel.</div>`;
        return;
      }

      if (!payload.owner_name) {
        box.innerHTML = `<div class="item">Informe seu nome.</div>`;
        return;
      }

      if (!currentCompanyId) {
        box.innerHTML = `<div class="item">Nenhuma imobiliária disponível para receber sua captação.</div>`;
        return;
      }

      const { error } = await supabase.from("property_submissions").insert(payload);

      if (error) {
        box.innerHTML = `<div class="item">${error.message}</div>`;
        return;
      }

      box.innerHTML = `<div class="item">Imóvel enviado com sucesso para análise.</div>`;
      clearForm();
      await loadMySubmissions();
    }

    function clearForm() {
      document.getElementById("title").value = "";
      document.getElementById("price").value = "";
      document.getElementById("area_m2").value = "";
      document.getElementById("bedrooms").value = "";
      document.getElementById("bathrooms").value = "";
      document.getElementById("garage_spots").value = "";
      document.getElementById("address").value = "";
      document.getElementById("neighborhood").value = "";
      document.getElementById("city").value = "";
      document.getElementById("state").value = "";
      document.getElementById("zip_code").value = "";
      document.getElementById("description").value = "";
      fillOwnerData();
    }

    async function loadMySubmissions() {
      const box = document.getElementById("submissions_list");

      if (!currentCompanyId) {
        box.innerHTML = `<div class="item">Nenhuma imobiliária vinculada.</div>`;
        return;
      }

      const { data, error } = await supabase
        .from("property_submissions")
        .select("*")
        .eq("company_id", currentCompanyId)
        .eq("owner_user_id", currentUser.id)
        .order("created_at", { ascending: false });

      if (error) {
        box.innerHTML = `<div class="item">${error.message}</div>`;
        return;
      }

      if (!data || !data.length) {
        box.innerHTML = `<div class="item">Você ainda não enviou nenhuma captação.</div>`;
        return;
      }

      box.innerHTML = data.map(s => `
        <div class="item">
          <b>${s.title}</b><br>
          ${propertyTypeLabel(s.property_type)} • ${purposeLabel(s.purpose)}<br>
          ${s.city || "-"}${s.neighborhood ? " • " + s.neighborhood : ""}<br>
          Preço desejado: ${formatMoney(s.price)}<br>
          <span class="badge">${statusLabel(s.status)}</span>
          ${s.description ? `<div class="muted" style="margin-top:8px;">${s.description}</div>` : ""}
          ${s.admin_notes ? `<div class="item" style="margin-top:10px;"><b>Retorno da imobiliária:</b><br>${s.admin_notes}</div>` : ""}
        </div>
      `).join("");
    }

    async function loadPage() {
      const session = await getSession();

      if (!session) {
        location.href = "./app.html";
        return;
      }

      currentUser = await getUser();
      currentProfile = await getProfile();

      if (currentProfile?.company_id) {
        currentCompanyId = currentProfile.company_id;
        document.getElementById("page_subtitle").textContent =
          `${currentProfile.imobix_companies?.name || "Imobiliária"} • Anunciar imóvel`;
      } else {
        const fallbackCompany = await getFallbackCompany();
        currentCompanyId = fallbackCompany?.id || null;
        document.getElementById("page_subtitle").textContent =
          `${fallbackCompany?.name || "Imobia"} • Anunciar imóvel`;
      }

      fillOwnerData();
      await loadMySubmissions();
    }

    loadPage();

    window.logout = logout;
    window.loadPage = loadPage;
    window.submitProperty = submitProperty;
  </script>
</body>
</html>
